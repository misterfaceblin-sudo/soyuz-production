<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Архив Наших Озвучек</title>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1e1e1e;
            --accent-color: #ff4500; /* Цвет акцента (оранжевый/мемный) */
            --text-color: #ffffff;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 40px 0;
        }

        h1 { font-size: 2.5rem; margin-bottom: 10px; }
        p { color: #aaa; }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .video-card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s ease;
            border: 1px solid #333;
        }

        .video-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-color);
        }

        video {
            width: 100%;
            display: block;
            background: #000;
        }

        .video-info {
            padding: 15px;
        }

        .video-title {
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        .video-meta {
            font-size: 0.9rem;
            color: #888;
        }

        /* Кнопка ТГ для связи */
        .tg-link {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: #0088cc;
            color: white;
            text-decoration: none;
            border-radius: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<header>
    <h1>🎬 Мемный Архив</h1>
    <p>Все наши озвучки в одном месте (и без лагов ТГ)</p>
    <a href="https://t.me/твой_канал" class="tg-link">Наш Telegram</a>
</header>

<main class="video-grid">
    <div class="video-card">
        <video controls preload="metadata">
            <source src="INDY _CROSS_SOUZ_PRODACSHEN.mp4" type="video/mp4">
            Ваш браузер не поддерживает видео.
        </video>
        <div class="video-info">
            <div class="video-title">Инди кросс 2 серия</div>
            <div class="video-meta">Озвучено: 29 марта</div>
        </div>
    </div>

    <div class="video-card">
        <video controls preload="metadata">
            <source src="ссылка_на_видео_2.mp4" type="video/mp4">
        </video>
        <div class="video-info">
            <div class="video-title">Тот самый ролик про...</div>
            <div class="video-meta">Озвучено: Февраль 2024</div>
        </div>
    </div>
</main>

</body>
</html>
